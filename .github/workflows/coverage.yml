name: Scala Coverage

on:
  pull_request:
  push:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run coverage
        run: sbt clean coverage test coverageReport
